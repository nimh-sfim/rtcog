name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-${{ runner.arch }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('minimal_env.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-conda-${{ env.CACHE_NUMBER }}-

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: rtcog_min
          environment-file: minimal_env.yaml
          auto-activate-base: false
          miniforge-version: latest
          use-only-tar-bz2: true

      - name: Install package
        shell: bash -el {0}
        run: python -m pip install -e .

      - name: Run unit tests
        shell: bash -el {0}
        run: |
          python -m pytest -q \
            -m "not local_data and not snapshot"
