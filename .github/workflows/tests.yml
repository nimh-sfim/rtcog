name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: docs/rtd-requirements.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r docs/rtd-requirements.txt

      - name: Build documentation
        env:
          READTHEDOCS: "True"
        run: >-
          python -m sphinx -W --keep-going -b html
          docs/source docs/_build/html

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-${{ runner.arch }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('minimal_env.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-conda-${{ env.CACHE_NUMBER }}-

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: rtcog_min
          environment-file: minimal_env.yaml
          auto-activate-base: false
          miniforge-version: latest
          use-only-tar-bz2: true

      - name: Install package
        shell: bash -el {0}
        run: python -m pip install -e .

      - name: Run unit tests
        shell: bash -el {0}
        run: |
          python -m pytest -q \
            -m "not local_data and not snapshot"
