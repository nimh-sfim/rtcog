# Required per-run values
# -----------------------
# Add these keys to a copy of this file, or provide the corresponding CLI
# options. The output directory must already exist.
# exp_type: basic
# mask_path: /absolute/path/to/mask.nii
# nvols: 300
# out_dir: /absolute/path/to/output
# out_prefix: sub-001_run-01

# General options
debug: false # set logger level to debug
silent: false # set logger level to critical
tcp_port: 53214
show_data: false
save_orig: false # save the unprocessed image data
discard: 10

# Preprocessing steps in order
steps:
  - name: EMA
    enabled: true
    save: false
    alpha: 0.98

  - name: iGLM
    enabled: true
    save: false
    num_polorts: 2
    iGLM_motion: true

  - name: kalman
    enabled: true
    save: false
    n_cores: 10

  - name: smooth
    enabled: true
    save: false
    fwhm: 4.0

  - name: snorm
    enabled: true
    save: false
  
  - name: windowing
    enabled: true
    save: false
    win_length: 4

# Experiment/GUI Options
no_action: false
fullscreen: false
q_path: questions_v1 # path to the questions used for the experiment

# Testing options
snapshot: false
test_latency: false

# ESAM also requires top-level match_path and hit_thr values. Both can be stored
# in this YAML file or provided as --match_path and --hit_thr CLI overrides.
# match_path: /absolute/path/to/template_data.npz
# hit_thr: 0.5

# Matching options (ESAM)
matching:
  match_method: mask
  match_start: 100 # Volume when matching should start
  vols_noaction: 45 # Min. number of volumes to wait since end of last action before declaring a new hit

# Hit options (ESAM)
hits:
  nconsec_vols: 2 # Number of consecutive vols over threshold required for a hit
  nonline: 1 # The number of templates that may exceed threshold at one time
  do_mot: true # Whether or not to do motion censoring
  mot_thr: 0.2  # Threshold for motion censoring (if do_mot)
